# Réglages du site Fil Roug'Anim

nom: Fil Roug'Anim
accroche: Ne perds pas le fil de ton anim
description: >-
  Comparez les sessions BAFA, BAFD et PSC1 partout en France : dates, ville, formule
  et prix, avec le lien vers chaque organisme. Gratuit, sans inscription.

url: https://filrouganim.fr
# Domaine acheté chez OVHcloud le 24 octobre 2026. Le fichier CNAME est créé à la fabrication.
nom_de_domaine: filrouganim.fr
chemin_de_base: ""
langue: fr

# Google Search Console : la valeur « content » de la balise meta proposée (à remplir par Pufu2).
google_site_verification: ""
# Mesure d'audience sans cookie (GoatCounter) : code du compte, vide = aucune mesure.
goatcounter: ""

# Adresse de contact affichée sur le site. En attendant une adresse @filrouganim.fr : celle de Jeuphorie.
email: contact@jeuphorie.fr

# Lien vers Jeuphorie (encart discret sur les guides et les pages de sessions)
jeuphorie:
  url: https://jeuphorie.fr/jeux-gratuits/
  texte: "Nouvel animateur ? Jeuphorie propose des grands jeux prêts à imprimer, dont 3 offerts, pour ton premier séjour ou ton stage pratique."

