# Offre fondateurs : les 10 premières structures paient moitié prix, à vie, tant que leur abonnement court.
# « reservees » est recalculé à chaque fabrication (structures fondatrices dans la base, fonction places_fondatrices).
fondateurs:
  places: 10
  reservees: 0

# Abonnement des structures : Stripe, compte « Fil Roug'Anim » (même micro-entreprise que Jeuphorie, compte séparé).
# Un seul tarif dégressif par formule : la quantité payée est le nombre de centres (la structure comprise).
# Les paiements sont relevés par outils/abonnements.py (GitHub Actions, toutes les 15 minutes).
abonnement:
  prix: "79 €"
  prix_fondateur: "39,50 €"
  centre_en_plus: "39,50 €"
  centre_en_plus_fondateur: "19,75 €"
  paiement: https://buy.stripe.com/eVq28s8Yy40011rfJEe7m00
  # le lien fondateur se ferme tout seul après 10 paiements
  paiement_fondateur: https://buy.stripe.com/dRmdRafmW6886lL7d8e7m02
  liens_stripe: [plink_1UaMsiKIAmufAQXGfqHfwFYK, plink_1UaMzrKIAmufAQXGhXgOnrPD]
  # espace des abonnés Stripe (factures, carte, nombre de centres, arrêt) : lien de connexion du portail client
  # (Stripe → Paramètres → Facturation → Portail client → « Lien de connexion »)
  portail: ""

# Comptes des candidats et des structures (Supabase, projet « filrouganim », région Paris).
# L'URL et la clé « publishable » sont faites pour être publiques : la sécurité vient des règles
# d'accès de la base (supabase/schema.sql). Ne jamais mettre ici la clé secrète.
supabase:
  url: https://abjimkhwbuhsfdnhweyy.supabase.co
  cle: sb_publishable_AMVfIm318LnwSUxNfQcNzQ_ZsOKvsJb
# Ouverts au public le 26/10/2026. false : la page /compte/ existe, mais le site n'y renvoie pas.
# true : les boutons « Créer mon profil » et « Créer le compte de ma structure » apparaissent.
# À passer à true après : l'envoi des e-mails par Brevo (SMTP), les mentions légales complètes.
comptes_ouverts: true
# Adresse d'envoi des alertes du lundi (outils/alertes.py) : une adresse du domaine, validée dans Brevo.
email_alertes: alertes@filrouganim.fr
# Adresse d'envoi des e-mails de connexion (outils/configurer_emails.py), sur le domaine authentifié dans Brevo.
email_connexion: connexion@filrouganim.fr
