name: Publier le site

on:
  # à chaque modification envoyée sur la branche principale (mise en ligne autorisée le 24/10/2026)
  push:
    branches: [main]
  # toutes les heures de 6 h à 23 h (heure de Paris en hiver) : les offres publiées depuis les comptes
  # arrivent sur le site, les sessions terminées et les offres expirées disparaissent
  schedule:
    - cron: "23 5-22 * * *"
  # bouton « Run workflow » dans l'onglet Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fabriquer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils de fabrication
        run: pip install -r requirements.txt
      - name: Fabriquer le site
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: fabriquer
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
