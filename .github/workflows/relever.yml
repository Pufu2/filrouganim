name: Relever les sessions

on:
  # chaque nuit : les diplômes professionnels (catalogue national, 5 requêtes) ;
  # le lundi et le jeudi : en plus, les sessions BAFA, BAFD et PSC1 sur les pages des organismes
  schedule:
    - cron: "41 3 * * *"
  # bouton « Run workflow » dans l'onglet Actions (tout est relevé)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relever
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: pip install -r requirements.txt
      - name: Diplômes professionnels (CPJEPS, BPJEPS, DEJEPS, DESJEPS)
        continue-on-error: true
        env:
          RCO_OFFREINFO_TOKEN: ${{ secrets.RCO_OFFREINFO_TOKEN }}
        run: python3 outils/relever_pro.py
      - name: Formations pros du catalogue Mon Compte Formation (Caisse des Dépôts)
        continue-on-error: true
        run: python3 outils/relever_cpf.py
      - name: BAFA, BAFD, PSC1 (lundi et jeudi)
        continue-on-error: true
        run: |
          jour=$(date -u +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$jour" = "1" ] || [ "$jour" = "4" ]; then
            python3 outils/relever.py
          else
            echo "Pas aujourd'hui (lundi et jeudi seulement)."
          fi
      - name: Placer les villes sur la carte (API Géo de l'État)
        continue-on-error: true
        run: python3 outils/geocoder.py
      - name: Chiffres de visibilité (GoatCounter, Search Console, comptes)
        continue-on-error: true
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          pip install -q google-auth requests
          python3 outils/audience.py
      - name: Le bilan du mois (un article du blog, une fois par mois)
        run: python3 build.py --bilan
      - name: Le site se fabrique-t-il toujours ?
        run: python3 build.py
      - name: Enregistrer les changements
        run: |
          git add donnees/sessions.yml donnees/sessions-pro.yml donnees/ecoles-pro.yml donnees/formations-cpf.yml donnees/audience.yml donnees/geo-communes.yml donnees/bilans
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git -c user.name=Pufu2 -c user.email=Pufu2@users.noreply.github.com commit -m "Sessions : relevé du $(date -u +%d/%m/%Y)"
          # du code a pu être publié pendant le relevé : on le récupère avant d'envoyer (seules les données changent ici)
          for essai in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 10
          done
          exit 1
