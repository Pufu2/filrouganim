# Organismes de formation BAFA / BAFD présents sur le site.
# Référence officielle des habilitations : arrêté du 4 septembre 2026 (JO du 17 sept. 2026),
# période du 1er janvier 2026 au 31 janvier 2029. Article 1 : habilitations nationales ;
# article 3 : habilitations régionales.
# https://www.legifrance.gouv.fr/jorf/id/JORFTEXT000054850965
# Liste officielle consultable : https://bafa-bafd.jeunes.gouv.fr/baf-candidat/app/liste-organisme-formation
#
# Champs :
#   id            identifiant court (utilisé dans sessions.yml et dans l'adresse de la page)
#   nom           nom affiché
#   habilitation  nationale | régionale (à confirmer dans l'arrêté avant publication)
#   site          page d'accueil BAFA de l'organisme
#   page_sessions page où l'organisme publie ses sessions (null : à trouver)
#   prix_en_ligne true si l'organisme affiche ses prix sur ses pages de sessions
#   en_ligne      true : une page est créée sur le site pour cet organisme
# Le texte de présentation est écrit par nous (jamais copié du site de l'organisme).

organismes:
  - id: afocal
    nom: AFOCAL
    habilitation: nationale
    site: https://www.afocal.fr/bafa/formation-bafa.html
    page_sessions: https://www.afocal.fr/bafa/recherche-bafa-ile-de-france-1-1.html
    prix_en_ligne: true
    en_ligne: true
    presentation: >-
      Association nationale de formation à l'animation, présente dans la plupart
      des régions. Elle organise des formations générales, des approfondissements et
      des sessions BAFD, souvent en externat. Chaque fiche de session affiche le prix
      et le nombre de places restantes.

  - id: ifac
    nom: IFAC
    habilitation: nationale
    site: https://ifac-formation.fr/formations/bafa-bafd/173
    page_sessions: "https://ifac-formation.fr/formations/sessions/bafa"
    prix_en_ligne: true
    en_ligne: true
    presentation: >-
      Institut de formation à l'animation et aux métiers de la petite enfance,
      présent dans plusieurs régions. Il propose de nombreuses formations générales
      pendant les vacances scolaires, des approfondissements à thème, et des
      formations professionnelles (CPJEPS, BPJEPS, DEJEPS, DESJEPS), souvent en
      apprentissage. Le prix figure sur la fiche de chaque session.

  - id: ufcv
    nom: UFCV
    habilitation: nationale
    site: https://bafa.ufcv.fr/
    page_sessions: https://bafa.ufcv.fr/
    prix_en_ligne: true
    en_ligne: true
    presentation: >-
      Union nationale d'éducation populaire, l'un des plus grands organismes de formation au BAFA
      et au BAFD, présent dans toutes les régions, avec de nombreux thèmes d'approfondissement
      et des sessions en externat, en demi-pension ou en internat.

  - id: ligue-idf
    nom: Ligue de l'enseignement Île-de-France
    habilitation: nationale
    site: https://www.laligueidf.org/bafa-bafd/
    page_sessions: https://formation-bafa-bafd.org/rechercher-un-stage/
    prix_en_ligne: true
    en_ligne: true
    presentation: >-
      Fédération régionale d'un grand mouvement d'éducation populaire. Ses sessions BAFA et BAFD
      ont lieu dans plusieurs départements franciliens, souvent en demi-pension, et se réservent
      sur son site dédié.

  - id: fscf-idf
    # robots.txt de bafaidf.com : interdit aux robots d'IA (dont Anthropic) -> jamais relevé automatiquement
    nom: FSCF Île-de-France
    habilitation: nationale
    site: https://www.bafaidf.com/
    page_sessions: https://www.bafaidf.com/agenda-des-formations
    prix_en_ligne: true
    en_ligne: false

  - id: cemea-idf
    # robots.txt de cemea-idf.org : interdit aux robots d'IA ; cemea-formation.com : pas de liste lisible (25/10/2026)
    nom: CEMEA Île-de-France
    habilitation: nationale
    site: https://cemea-idf.org/formations/bafa/
    page_sessions: https://cemea-formation.com/bafa/ile-de-france/
    prix_en_ligne: null
    en_ligne: false

  - id: planete-sciences
    nom: Planète Sciences
    habilitation: nationale
    site: https://www.planete-sciences.org/animations-formations/formations-53/BAFA
    page_sessions: null
    prix_en_ligne: null
    en_ligne: false

  - id: ucpa
    nom: UCPA
    habilitation: nationale
    site: https://www.ucpa.com/nos-formations-par-secteurs/bafa-bafd
    page_sessions: null
    prix_en_ligne: null
    en_ligne: false

  - id: fsgt-idf
    nom: FSGT Île-de-France
    habilitation: à confirmer
    site: https://idf.fsgt.org/les-bafa/
    page_sessions: https://idf.fsgt.org/les-bafa/
    prix_en_ligne: null
    en_ligne: false

  # À trouver : Francas, Léo Lagrange, Familles Rurales, scoutisme (SGDF, EEDF, EEUdF),
  # CPCV Île-de-France, et les organismes de l'article 3 de l'arrêté (habilitation régionale).

  - id: protection-civile
    nom: Protection civile
    habilitation: premiers secours
    site: https://formations.protection-civile.org/formation-psc/
    page_sessions: https://formations.protection-civile.org/formation-psc/
    prix_en_ligne: true
    en_ligne: true
    presentation: >-
      Fédération nationale de protection civile, association agréée de sécurité civile.
      Ses associations départementales organisent le PSC (premiers secours citoyen, ex-PSC1 :
      7 heures, en une journée) dans presque toute la France. Le PSC n'est pas une étape du
      BAFA, mais il est souvent demandé aux animateurs et il est obligatoire pour entrer en BPJEPS.

  - id: cemea
    nom: CEMEA
    habilitation: nationale
    site: https://cemea-formation.com/bafa
    page_sessions: https://cemea-formation.com/bafa
    prix_en_ligne: true
    en_ligne: true
    presentation: >-
      Centres d'entraînement aux méthodes d'éducation active, mouvement d'éducation nouvelle
      présent dans toutes les régions. Ils organisent des formations générales, des approfondissements
      BAFA et des sessions BAFD, ainsi que des CPJEPS, BPJEPS, DEJEPS et DESJEPS. Le prix affiché
      comprend les frais pédagogiques et, selon la session, les repas ou l'hébergement.

  - id: croix-rouge
    nom: Croix-Rouge française
    habilitation: premiers secours
    site: https://inscription-formation.croix-rouge.fr/
    page_sessions: https://inscription-formation.croix-rouge.fr/
    prix_en_ligne: true
    en_ligne: true
    presentation: >-
      Association agréée de sécurité civile. Ses unités locales organisent le PSC (premiers
      secours citoyen, ex-PSC1) partout en France, en une journée ou en version hybride (une
      partie en ligne avant la journée). Les sessions, leur prix et les places restantes sont
      sur sa plateforme nationale d'inscription.

  - id: familles-rurales
    nom: Familles Rurales
    habilitation: nationale
    site: https://www.ma-formation-bafa.fr/
    page_sessions: https://www.ma-formation-bafa.fr/sessions/toutes/toutes/toutes/toutes/tous
    prix_en_ligne: true
    en_ligne: true
    presentation: >-
      Mouvement familial présent surtout dans les territoires ruraux et périurbains. Il organise des formations
      BAFA et BAFD dans de nombreuses régions, en internat, en demi-pension ou en externat ; à Paris, ses sessions
      sont proposées avec la FACEL. Les prix de chaque formule sont affichés sur sa liste de sessions.

  - id: francas
    nom: Les Francas
    habilitation: nationale
    site: https://www.bafa-lesfrancas.fr/
    page_sessions: https://www.bafa-lesfrancas.fr/recherche-de-stage
    prix_en_ligne: true
    en_ligne: true
    presentation: >-
      Mouvement d'éducation populaire tourné vers les loisirs des enfants et les centres de loisirs. Ses
      associations départementales organisent des formations générales, des approfondissements et des sessions
      BAFD ; une petite adhésion s'ajoute souvent au prix du stage.

  - id: fscf
    nom: FSCF
    habilitation: nationale
    site: https://fscf.asso.fr/bafa/
    page_sessions: https://fscf.asso.fr/calendrier-des-formations/?type=bafa-bafd
    prix_en_ligne: true
    en_ligne: true
    presentation: >-
      Fédération sportive et culturelle de France : ses comités régionaux et départementaux organisent des
      sessions BAFA et BAFD, souvent tournées vers le sport et les activités de plein air. Le prix est plus bas
      pour les licenciés de la fédération.

