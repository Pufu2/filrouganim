# Sessions BAFA / BAFD en Île-de-France.
# Faits seulement (dates, lieu, formule, prix) et lien vers la page de l'organisme :
# jamais les textes des organismes. Voir docs/METTRE-A-JOUR-LES-SESSIONS.md.
#
# Champs :
#   id           identifiant unique et stable
#   organisme    id dans organismes.yml
#   diplome      BAFA | BAFD
#   type         formation-generale | approfondissement | qualification | perfectionnement
#   theme        thème de l'approfondissement ou de la qualification (null sinon)
#   debut, fin   AAAA-MM-JJ (la période de vacances est calculée toute seule)
#   ville        commune (et arrondissement à Paris si connu)
#   departement  "75", "77"…
#   formule      internat | demi-pension | externat | null (pas encore relevée)
#   prix         en euros, tel qu'affiché par l'organisme ; null si non relevé
#   prix_note    précision éventuelle sur le prix
#   aides        aides mentionnées par l'organisme sur la page de la session
#   complet      true si l'organisme indique « complet »
#   url          page de la session chez l'organisme (ou sa liste de sessions)
#   releve_le    date du relevé
#   verifie_le   date de la dernière vérification sur la page de l'organisme (null : pas encore)
#   source       page-organisme | moteur-de-recherche (relevé indirect, à revérifier)
#
# Relevé du 25 octobre 2026 : fait à partir des pages des organismes telles qu'elles
# apparaissent dans un moteur de recherche (le réseau de l'espace de travail ne joignait
# pas les sites). Tout est donc « à revérifier » avant la mise en ligne.

