# Sessions BAFA / BAFD en Île-de-France.
# Faits seulement (dates, lieu, formule, prix) et lien vers la page de l'organisme :
# jamais les textes des organismes. Voir docs/METTRE-A-JOUR-LES-SESSIONS.md.
#
# Sélection (pour ne pas reprendre l'essentiel de la base d'un organisme) : par organisme,
# une session par département, par vacances et par étape (la première non complète, par date
# puis par prix). Les autres sessions sont accessibles par le lien vers la page de l'organisme.
#
# Champs :
#   id           identifiant unique et stable (organisme + numéro de la session chez lui)
#   organisme    id dans organismes.yml
#   diplome      BAFA | BAFD
#   type         formation-generale | approfondissement | qualification | perfectionnement
#   theme        thème de l'approfondissement (null sinon ou si non précisé)
#   debut, fin   AAAA-MM-JJ (la période de vacances est calculée toute seule)
#   ville        commune (arrondissement à Paris)
#   departement  "75", "77"…
#   formule      internat | demi-pension | externat | null
#   prix         en euros, tel qu'affiché par l'organisme ; null si non affiché
#   prix_note    précision éventuelle (autres formules, session en plusieurs parties…)
#   aides        aides mentionnées par l'organisme sur la page de la session
#   complet      true si l'organisme indique « complet »
#   url          page de la session chez l'organisme
#   releve_le    date du premier relevé
#   verifie_le   date de la dernière vérification sur la page de l'organisme
#   source       page-organisme
#
# Relevé et vérification du 24 octobre 2026 sur les pages des organismes (AFOCAL, IFAC),
# robots.txt respectés (aucune page de session interdite).

