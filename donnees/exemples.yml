# Exemples fictifs montrés aux candidats et aux structures : ce n'est ni une vraie structure, ni une vraie personne.
structure:
  nom: "L'Atelier des Pelotes"
  slug: exemple-de-page-structure
  type: accueil-de-loisirs
  ville: Créteil
  departement: "94"
  couleur: sauge
  fondatrice: true
  accroche: "Un centre de loisirs où les enfants choisissent leurs activités, et une équipe qui se forme ensemble."
  publics: ["3-5", "6-11", handicap]
  activites: [grands jeux, cuisine, jardin, théâtre, sorties nature, ateliers vélo]
  lieux: "Accueil de loisirs à Créteil (mercredis et vacances), mini-camps en Seine-et-Marne l'été."
  presentation: |-
    Nous accueillons jusqu'à 80 enfants de 3 à 11 ans, les mercredis et pendant les vacances scolaires.

    L'équipe compte une dizaine d'animateurs, dont des stagiaires BAFA que nous accompagnons tout au long de leur stage pratique.
  projet: |-
    Laisser les enfants choisir : chaque matin, ils votent pour les activités de l'après-midi.

    Accueillir tout le monde : un animateur référent suit les enfants en situation de handicap, avec leurs familles.
  avantages: |-
    Un temps de préparation payé avant chaque période de vacances.
    Un tuteur pour chaque stagiaire BAFA, et une aide pour financer l'approfondissement.
    Des réunions d'équipe courtes, chaque semaine.
  site: null
  # une structure peut regrouper plusieurs centres, chacun avec sa page et ses offres
  centres:
    - {nom: "Les Pelotes du Mont-Mesly", type: accueil-de-loisirs, ville: Créteil, departement: "94"}
    - {nom: "Mini-camps des Pelotes", type: sejours, ville: Fontainebleau, departement: "77"}
  offres:
    - {intitule: "Animateur·rice stagiaire BAFA, vacances d'hiver", ville: Créteil, departement: "94", debut: 2027-02-08, contrat: cee}
    - {intitule: "Animateur·rice BAFA, mercredis 2026-2027", ville: Créteil, departement: "94", debut: 2026-11-04, contrat: cdd}

