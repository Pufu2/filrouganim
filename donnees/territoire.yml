# Vacances scolaires 2026-2027 par zone. Source : Onisep, « Vacances scolaires : calendrier 2026-2027 »,
# https://www.onisep.fr/vacances-scolaires-calendrier-2026-2027 (lu le 26 octobre 2026), d'après l'arrêté du
# 22 octobre 2025. debut : premier jour des vacances ; fin : jour de la reprise. Une session est rattachée aux
# vacances de la zone de son département qui contiennent sa date de début.
# Été 2027 : à partir du 3 juillet ; la date de la rentrée 2027 n'étant pas encore connue, fin au 31 août.
periodes:
  - {id: toussaint-2026, nom: "vacances de la Toussaint 2026", court: "Toussaint 2026", slug: vacances-toussaint-2026, debut: 2026-10-17, fin: 2026-11-02}
  - {id: noel-2026, nom: "vacances de Noël 2026", court: "Noël 2026", slug: vacances-noel-2026, debut: 2026-12-19, fin: 2027-01-04}
  - id: hiver-2027
    nom: "vacances d'hiver 2027"
    court: "Hiver 2027"
    slug: vacances-hiver-2027
    debut: 2027-02-06
    fin: 2027-03-08
    zones:
      A: {debut: 2027-02-13, fin: 2027-03-01}
      B: {debut: 2027-02-20, fin: 2027-03-08}
      C: {debut: 2027-02-06, fin: 2027-02-22}
  - id: printemps-2027
    nom: "vacances de printemps 2027"
    court: "Printemps 2027"
    slug: vacances-printemps-2027
    debut: 2027-04-03
    fin: 2027-05-03
    zones:
      A: {debut: 2027-04-10, fin: 2027-04-26}
      B: {debut: 2027-04-17, fin: 2027-05-03}
      C: {debut: 2027-04-03, fin: 2027-04-19}
  - {id: ete-2027, nom: "vacances d'été 2027", court: "Été 2027", slug: vacances-ete-2027, debut: 2027-07-03, fin: 2027-08-31}

