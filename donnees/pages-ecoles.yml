# Pages de formation des écoles lues par outils/pages_ecoles.py (diplômes professionnels de l'animation).
# Une entrée par page : l'école, le diplôme et sa spécialité (donnees/specialites.yml), la ville et le
# département à prendre quand la page n'en écrit pas. Ajouter une école : vérifier d'abord que son robots.txt
# l'autorise, et qu'au moins une session est trouvée (python3 outils/relever_pro.py --essai).
# Les CEMEA, l'IFAC et Léo Lagrange ont leur propre lecture ; le calendrier national (FOROMES) et le catalogue
# de l'apprentissage complètent pour toutes les autres écoles.

